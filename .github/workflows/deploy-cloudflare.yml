name: Deploy Cloudflare Worker

on:
  push:
    branches-ignore:
      - atlas-asset-releases
  workflow_dispatch:
    inputs:
      target:
        description: Choose the deployment target
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

jobs:
  preview:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    concurrency:
      group: atlas-preview-${{ github.ref }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ATLAS_ASSET_RELEASE_MODE: preview
      ATLAS_XLSX: ${{ github.workspace }}/docs/portfolio-operations-dashboard/assets/xlsx.full.min.js
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run complete discovered test suite
        run: node tools/test-all.mjs --output output/test-all/ci

      - name: Retain sanitized test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.job }}
          path: output/test-all/ci/results.json
          if-no-files-found: warn

      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.72.0

      - name: Upload preview Worker version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.72.0"
          command: versions upload

  production:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    concurrency:
      group: atlas-production-publisher
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      ATLAS_ASSET_RELEASE_MODE: publish
      ATLAS_XLSX: ${{ github.workspace }}/docs/portfolio-operations-dashboard/assets/xlsx.full.min.js
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          npx playwright install --with-deps chromium

      - name: Run complete discovered test suite
        run: node tools/test-all.mjs --output output/test-all/ci

      - name: Retain sanitized test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.job }}
          path: output/test-all/ci/results.json
          if-no-files-found: warn

      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.72.0

      - name: Verify scoped workspace database reader is deployed
        run: node tools/verify-workspace-backend.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and retain one artifact for both hosts
        run: node tools/build-atlas-site.mjs

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.72.0"
          command: deploy --keep-vars

      - name: Upload the same artifact to GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/atlas-site

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
