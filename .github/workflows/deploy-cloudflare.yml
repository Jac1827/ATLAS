name: Deploy Cloudflare Worker

on:
  push:
    branches-ignore:
      - atlas-asset-releases
  workflow_dispatch:
    inputs:
      target:
        description: Choose the deployment target
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production
      client_rollback_ref:
        description: Optional production-only client recovery; exact reviewed full 40-character commit. Requires independently verified release hash below. Leave both empty for normal releases.
        type: string
        required: false
        default: ""
      client_rollback_release:
        description: Independently reviewed full 64-character asset release hash for the selected recovery commit; mismatch stops publication.
        type: string
        required: false
        default: ""
      finance_release_hash:
        description: Optional production-only finance compatibility release. Exact independently reviewed asset hash; preserves operational release 774663 and does not migrate its data source. Mutually exclusive with client recovery.
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  preview:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    concurrency:
      group: atlas-preview-${{ github.ref }}
      cancel-in-progress: false
    # Pinned: the ubuntu-latest move to Ubuntu 26.04 left apt mirror lookups failing while
    # Playwright installs browser dependencies. Revisit when 26.04 images are stable.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ATLAS_ASSET_RELEASE_MODE: preview
      ATLAS_XLSX: ${{ github.workspace }}/docs/portfolio-operations-dashboard/assets/xlsx.full.min.js
    steps:
      - name: Reject a rollback on the preview target
        if: github.event_name == 'workflow_dispatch' && (inputs.client_rollback_ref != '' || inputs.client_rollback_release != '' || inputs.finance_release_hash != '')
        run: echo 'Client rollback requires the production target.' && exit 1

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          for attempt in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$attempt" = 3 ] && exit 1; echo "Browser dependency install failed (attempt $attempt); retrying in 30s"; sleep 30; done

      - name: Run complete discovered test suite
        run: node tools/test-all.mjs --output output/test-all/ci

      - name: Retain sanitized test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.job }}
          path: |
            output/test-all/ci/results.json
            output/test-all/ci/*-reforecast-report-library-browser.test.mjs.log
            output/test-all/ci/*-finance-compat-browser.test.mjs.log
            output/test-all/ci/*-workspace-startup-browser.test.mjs.log
            output/test-all/ci/*-report-approved-occupancy-browser.test.mjs.log
            output/test-all/ci/*-community-finance-period-warning.test.mjs.log
            output/test-all/ci/*-str-ltr-comparison-browser.test.mjs.log
            output/test-all/ci/*-saved-str-programme-browser.test.mjs.log
            output/test-all/ci/*-archive-blob-browser.test.mjs.log
          if-no-files-found: warn

      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.72.0

      - name: Upload preview Worker version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.72.0"
          command: versions upload

  production:
    if: ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')) && (vars.ATLAS_SCOPED_WORKSPACE_READY == 'true' || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.client_rollback_ref != '' && inputs.client_rollback_release != '') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production' && inputs.finance_release_hash != '' && inputs.finance_release_hash != null))
    concurrency:
      group: atlas-production-publisher
      cancel-in-progress: false
    # Pinned: the ubuntu-latest move to Ubuntu 26.04 left apt mirror lookups failing while
    # Playwright installs browser dependencies. Revisit when 26.04 images are stable.
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: write
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      ATLAS_ASSET_RELEASE_MODE: publish
      PAGES_ARTIFACT_NAME: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      ATLAS_CLIENT_ROLLBACK_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.client_rollback_ref || '' }}
      ATLAS_CLIENT_ROLLBACK_RELEASE: ${{ github.event_name == 'workflow_dispatch' && inputs.client_rollback_release || '' }}
      ATLAS_FINANCE_RELEASE_HASH: ${{ github.event_name == 'workflow_dispatch' && inputs.finance_release_hash || '' }}
      ATLAS_XLSX: ${{ github.workspace }}/docs/portfolio-operations-dashboard/assets/xlsx.full.min.js
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Validate explicit current or reviewed-client selection
        run: node tools/build-atlas-client-rollback.mjs --validate

      - name: Validate explicit finance compatibility selection
        run: node tools/build-atlas-finance-release.mjs --validate

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Install pinned browser test runtime
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
          for attempt in 1 2 3; do npx playwright install --with-deps chromium && break; [ "$attempt" = 3 ] && exit 1; echo "Browser dependency install failed (attempt $attempt); retrying in 30s"; sleep 30; done

      - name: Run complete discovered test suite
        run: node tools/test-all.mjs --output output/test-all/ci

      - name: Verify explicit client rollback packaging
        if: env.ATLAS_CLIENT_ROLLBACK_REF != ''
        run: node tools/client-rollback.test.mjs

      - name: Retain sanitized test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ github.job }}
          path: |
            output/test-all/ci/results.json
            output/test-all/ci/*-reforecast-report-library-browser.test.mjs.log
            output/test-all/ci/*-finance-compat-browser.test.mjs.log
            output/test-all/ci/*-workspace-startup-browser.test.mjs.log
            output/test-all/ci/*-report-approved-occupancy-browser.test.mjs.log
            output/test-all/ci/*-community-finance-period-warning.test.mjs.log
            output/test-all/ci/*-str-ltr-comparison-browser.test.mjs.log
            output/test-all/ci/*-saved-str-programme-browser.test.mjs.log
            output/test-all/ci/*-archive-blob-browser.test.mjs.log
          if-no-files-found: warn

      - name: Install Wrangler
        run: npm install --no-save --package-lock=false wrangler@4.72.0

      - name: Verify scoped workspace database reader is deployed
        run: node tools/verify-workspace-backend.mjs

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build and retain one artifact for both hosts
        if: env.ATLAS_CLIENT_ROLLBACK_REF == '' && env.ATLAS_FINANCE_RELEASE_HASH == ''
        run: node tools/build-atlas-site.mjs

      - name: Package the reviewed prior client and retain every release
        if: env.ATLAS_CLIENT_ROLLBACK_REF != ''
        run: node tools/build-atlas-client-rollback.mjs

      - name: Package the reviewed finance interface with preserved operations
        if: env.ATLAS_FINANCE_RELEASE_HASH != ''
        run: node tools/build-atlas-finance-release.mjs

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4.72.0"
          command: deploy --keep-vars ${{ env.ATLAS_CLIENT_ROLLBACK_REF != '' && '--config output/atlas-rollback-wrangler.json' || env.ATLAS_FINANCE_RELEASE_HASH != '' && '--config output/atlas-finance-wrangler.json' || '' }}

      - name: Verify the rollback artifact is unchanged before Pages
        if: env.ATLAS_CLIENT_ROLLBACK_REF != ''
        run: node tools/build-atlas-client-rollback.mjs --verify

      - name: Verify the finance artifact is unchanged before Pages
        if: env.ATLAS_FINANCE_RELEASE_HASH != ''
        run: node tools/build-atlas-finance-release.mjs --verify

      - name: Retain finance compatibility evidence
        if: env.ATLAS_FINANCE_RELEASE_HASH != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: finance-release-evidence
          path: output/atlas-finance-release.json
          if-no-files-found: warn

      - name: Retain client recovery evidence
        if: env.ATLAS_CLIENT_ROLLBACK_REF != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: client-rollback-evidence
          path: output/atlas-client-rollback.json
          if-no-files-found: warn

      - name: Upload the same artifact to GitHub Pages
        id: upload_pages
        uses: actions/upload-pages-artifact@v3
        with:
          name: ${{ env.PAGES_ARTIFACT_NAME }}
          path: output/atlas-site

      - name: Verify the unique Pages artifact for this attempt
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload_pages.outputs.artifact_id }}
        with:
          script: |
            const name = process.env.PAGES_ARTIFACT_NAME;
            const id = Number(process.env.PAGES_ARTIFACT_ID);
            if (name !== `github-pages-${context.runId}-${process.env.GITHUB_RUN_ATTEMPT}` ||
                !Number.isSafeInteger(id) || id <= 0) {
              throw new Error('Pages upload identity outputs are missing or invalid.');
            }
            for (let attempt = 0; attempt < 6; attempt++) {
              const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                ...context.repo, run_id: context.runId, name, per_page: 100
              });
              const matches = artifacts.filter(artifact => artifact.name === name);
              if (matches.length === 0 && attempt < 5) {
                await new Promise(resolve => setTimeout(resolve, 5000));
                continue;
              }
              if (matches.length !== 1) throw new Error(`Expected exactly one Pages artifact for this attempt; found ${matches.length}.`);
              // The official Pages uploader exposes the immutable ID but not its digest.
              const {data: uploaded} = await github.rest.actions.getArtifact({...context.repo, artifact_id: id});
              const digest = uploaded.digest;
              if (uploaded.id !== id || !/^sha256:[a-f0-9]{64}$/.test(digest || '')) {
                throw new Error('The uploaded Pages artifact has no valid immutable identity and digest.');
              }
              const artifact = matches[0];
              if (artifact.id !== id || artifact.digest !== digest || artifact.expired ||
                  artifact.workflow_run?.id !== context.runId || artifact.workflow_run.head_sha !== context.sha) {
                throw new Error('Pages artifact metadata does not match this attempt\'s immutable upload.');
              }
              core.info(`Verified unique Pages artifact ${name}, ID ${id}, digest ${digest}.`);
              break;
            }

      - name: Deploy GitHub Pages
        id: pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: ${{ env.PAGES_ARTIFACT_NAME }}
