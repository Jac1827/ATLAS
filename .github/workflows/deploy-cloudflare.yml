name: Deploy Cloudflare Worker

on:
  push:
  workflow_dispatch:
    inputs:
      target:
        description: Choose the deployment target
        type: choice
        required: true
        default: preview
        options:
          - preview
          - production

permissions:
  contents: read

concurrency:
  group: cloudflare-worker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    if: (github.event_name == 'push' && github.ref != 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'preview')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Test dashboard presentation and ticker lifecycle
        run: |
          node test-ticker.mjs
          node tools/screening-client.test.cjs
          node tools/application-lineage.test.cjs
          node tools/application-lineage-db.test.cjs
          node tools/application-propagation.test.cjs
          node tools/application-publication-client.test.cjs
          node tools/dashboard-reskin.test.cjs
          node tools/home-bonus-performance.test.cjs

      - name: Test delinquency mapping contract
        run: node tools/delinquency-mapping.test.cjs

      - name: Test reporting data and weekly report
        run: |
          node tools/reporting-repair.test.cjs
          node tools/canonical-report-data.test.cjs
          node tools/weekly-funnel.test.cjs
          node tools/application-aging.test.cjs
          node tools/storage-capacity.test.cjs

      - name: Test property organization and special history
        run: |
          node tools/box-score-floor-plans.test.cjs
          node tools/property-intelligence.test.cjs
          node tools/property-organization.test.cjs
          node tools/property-specials.test.mjs
          node tools/property-specials-store.test.mjs
          node tools/property-specials-api.test.mjs
          node tools/concession-insights.test.cjs

      - name: Test occupancy dashboard contract
        run: |
          node tools/occupancy-contract.test.cjs
          node tools/occupancy-history-stabilization.test.cjs
          node tools/occupancy-financial-import.test.cjs
          node tools/financial-publication.test.cjs
          node tools/investor-packet-sources.test.cjs

      - name: Test utility forecast and finance lineage
        run: |
          node tools/utility-forecast.test.mjs
          node tools/utility-forecast-db.test.cjs
          node tools/utility-report-lineage.test.cjs

      - name: Test governed forecast builder and baseline consumers
        run: |
          node tools/performance-assets.test.cjs
          node tools/reforecast-builder-ui.test.mjs
          node tools/reforecast-provider.test.mjs
          node tools/reforecast-engine.test.mjs
          node tools/reforecast-store.test.mjs
          node tools/reforecast-ui.test.mjs
          node tools/reforecast-report.test.mjs
          node tools/reforecast-consumers.test.mjs
          node tools/reforecast-utility.test.mjs
          node tools/reforecast-bonus.test.mjs
          node tools/bonus-export-security.test.cjs
          node tools/bonus-prerequisites.test.cjs
          node tools/bonus-financial-attainment.test.cjs
          node tools/reforecast-bonus-current-db.test.cjs
          node tools/reforecast-bonus-receipts-db.test.cjs
          node tools/reforecast-builder-db.test.cjs
          node tools/reforecast-builder-upgrade-db.test.cjs
          node tools/reforecast-original-baseline-db.test.cjs
          node tools/reforecast-builder-integration-db.test.cjs
          node tools/forecast-contract-workflow-db.test.cjs
          node tools/reforecast-report-receipts-db.test.cjs
          node tools/reforecast-utility-db.test.cjs
          node tools/canonical-finance.test.mjs
          node tools/canonical-budget-report.test.mjs
          node tools/financial-close.test.mjs
          node tools/financial-close-report.test.mjs
          node tools/financial-snapshot-output.test.mjs
          node tools/community-plan-email.test.mjs
          node tools/community-finance-roster.test.mjs

      - name: Test eviction packet workflow
        run: node tools/eviction-attorney.test.mjs

      - name: Install Wrangler
        run: npm install --no-save wrangler@^4

      - name: Upload preview Worker version
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: versions upload

  production:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.target == 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install application dependencies
        run: npm ci --ignore-scripts

      - name: Test dashboard presentation and ticker lifecycle
        run: |
          node test-ticker.mjs
          node tools/screening-client.test.cjs
          node tools/application-lineage.test.cjs
          node tools/application-lineage-db.test.cjs
          node tools/application-propagation.test.cjs
          node tools/application-publication-client.test.cjs
          node tools/dashboard-reskin.test.cjs
          node tools/home-bonus-performance.test.cjs

      - name: Test delinquency mapping contract
        run: node tools/delinquency-mapping.test.cjs

      - name: Test reporting data and weekly report
        run: |
          node tools/reporting-repair.test.cjs
          node tools/canonical-report-data.test.cjs
          node tools/weekly-funnel.test.cjs
          node tools/application-aging.test.cjs
          node tools/storage-capacity.test.cjs

      - name: Test property organization and special history
        run: |
          node tools/box-score-floor-plans.test.cjs
          node tools/property-intelligence.test.cjs
          node tools/property-organization.test.cjs
          node tools/property-specials.test.mjs
          node tools/property-specials-store.test.mjs
          node tools/property-specials-api.test.mjs
          node tools/concession-insights.test.cjs

      - name: Test occupancy dashboard contract
        run: |
          node tools/occupancy-contract.test.cjs
          node tools/occupancy-history-stabilization.test.cjs
          node tools/occupancy-financial-import.test.cjs
          node tools/financial-publication.test.cjs
          node tools/investor-packet-sources.test.cjs

      - name: Test utility forecast and finance lineage
        run: |
          node tools/utility-forecast.test.mjs
          node tools/utility-forecast-db.test.cjs
          node tools/utility-report-lineage.test.cjs

      - name: Test governed forecast builder and baseline consumers
        run: |
          node tools/performance-assets.test.cjs
          node tools/reforecast-builder-ui.test.mjs
          node tools/reforecast-provider.test.mjs
          node tools/reforecast-engine.test.mjs
          node tools/reforecast-store.test.mjs
          node tools/reforecast-ui.test.mjs
          node tools/reforecast-report.test.mjs
          node tools/reforecast-consumers.test.mjs
          node tools/reforecast-utility.test.mjs
          node tools/reforecast-bonus.test.mjs
          node tools/bonus-export-security.test.cjs
          node tools/bonus-prerequisites.test.cjs
          node tools/bonus-financial-attainment.test.cjs
          node tools/reforecast-bonus-current-db.test.cjs
          node tools/reforecast-bonus-receipts-db.test.cjs
          node tools/reforecast-builder-db.test.cjs
          node tools/reforecast-builder-upgrade-db.test.cjs
          node tools/reforecast-original-baseline-db.test.cjs
          node tools/reforecast-builder-integration-db.test.cjs
          node tools/forecast-contract-workflow-db.test.cjs
          node tools/reforecast-report-receipts-db.test.cjs
          node tools/reforecast-utility-db.test.cjs
          node tools/canonical-finance.test.mjs
          node tools/canonical-budget-report.test.mjs
          node tools/financial-close.test.mjs
          node tools/financial-close-report.test.mjs
          node tools/financial-snapshot-output.test.mjs
          node tools/community-plan-email.test.mjs
          node tools/community-finance-roster.test.mjs

      - name: Test eviction packet workflow
        run: node tools/eviction-attorney.test.mjs

      - name: Install Wrangler
        run: npm install --no-save wrangler@^4

      - name: Deploy production Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          wranglerVersion: "4"
          command: deploy --keep-vars
