name: Occupancy integrity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  occupancy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate import publication and source mapping
        run: node tools/occupancy-publication-safety.test.cjs
      - name: Validate community and portfolio occupancy contract
        run: node tools/occupancy-contract.test.cjs
      - name: Validate inventory basis
        run: node tools/student-occupancy-basis.test.cjs
      - name: Validate historical boundaries
        run: node tools/trending-boundaries.test.cjs
      - name: Validate governed planning
        run: node tools/community-governed-planning.test.cjs
      - name: Validate archive replay
        run: node tools/archive-replay.test.cjs
      - name: Validate scoped occupancy revisions
        run: node tools/occupancy-scoped-replay.test.cjs
      - name: Validate lossless migration evidence
        run: node tools/migration-archive.test.cjs
      - name: Validate migration restore persistence
        run: node tools/migration-restore.test.cjs
      - name: Validate recommendation occupancy
        run: node tools/occupancy-recommendations.test.cjs
      - name: Validate historical upload period selection
        run: node tools/import-period-selection.test.cjs
      - name: Validate multi-month renewal refresh
        run: node tools/renewal-multiperiod.test.cjs
      - name: Validate semantic budget comparisons and coverage
        run: node tools/budget-comparison-integrity.test.cjs

  community-command:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned local Postgres test engine
        run: npm install --no-save --ignore-scripts @electric-sql/pglite@0.3.14
      - name: Validate Community Command calculations and shared-plan security
        run: |
          node tools/community-command-contract.test.cjs
          node tools/community-command-db.test.cjs
          node tools/community-plan-email.test.mjs
          node tools/community-finance-roster.test.mjs
          node tools/fiscal-ytd.test.mjs
          node tools/community-report-progress.test.mjs

  performance-boundaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the existing workbook parser for generated-fixture tests
        run: npm install --no-save --ignore-scripts xlsx@0.18.5
      - name: Validate startup and performance boundaries (not browser acceptance)
        run: |
          node tools/startup-performance.test.cjs
          node tools/performance-diagnostics.test.cjs
          node tools/central-api-performance.test.cjs
          node tools/performance-assets.test.cjs
          node tools/feature-loader.test.cjs
          node tools/staffing-performance.test.cjs
          node tools/data-import-health-performance.test.cjs
          node tools/staffing-turnover.test.cjs
          node tools/occupancy-replay-browser-performance.test.cjs
          node tools/archive-performance.test.cjs
          node tools/workbook-performance.test.cjs
