name: Recover tested Budget Builder Pages artifact

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: atlas-production-publisher
  cancel-in-progress: false

jobs:
  recover:
    if: github.repository == 'Jac1827/ATLAS' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: https://jac1827.github.io/ATLAS/
    steps:
      - name: Verify the tested source artifact
        id: verify_source
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const expected = Object.freeze({
              repositoryId: 1279553811,
              sourceRunId: 42699803966,
              sourceJobId: 129441197260,
              sourceAttempt: 1,
              sourceWorkflowId: 301814189,
              sourceWorkflow: '.github/workflows/deploy-cloudflare.yml',
              sourceSha: '7854f633a93a8506a5bf511faf208c2df758b03d',
              artifactId: 13711983408,
              artifactBytes: 1815586816,
              artifactDigest: 'sha256:cdaeba0c38d7b4fbc2b6a80bcf4f8de3b7a1e72c81171407c738e7845a7d9a4a',
              recoveryWorkflow: '.github/workflows/recover-budget-pages.yml',
              releaseId: 'bb98ff8e395aa995d231176b8f0288487ab4b80480ad1b8a4f5942d298277d53',
              manifestSha256: '7595fca062147f8314122532291a08e3ae47f828017504569d1b1261c01e7599',
              retainedReleases: 81,
              pagesUrl: 'https://jac1827.github.io/ATLAS/'
            });
            const repo = {owner: 'Jac1827', repo: 'ATLAS'};
            const reject = message => { const e = new Error(message); e.safeRecoveryMessage = true; throw e; };
            const requireGuard = (ok, message) => { if (!ok) reject(message); };
            try {
              requireGuard(context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/main' &&
                context.repo.owner === repo.owner && context.repo.repo === repo.repo,
                'Recovery must be dispatched from this repository main branch.');
              const {data: main} = await github.rest.git.getRef({...repo, ref: 'heads/main'});
              requireGuard(main.object.sha === context.sha, 'Main changed after this recovery was dispatched.');
              const {data: comparison} = await github.rest.repos.compareCommitsWithBasehead({
                ...repo, basehead: `${expected.sourceSha}...${context.sha}`
              });
              requireGuard(comparison.status === 'ahead' && comparison.merge_base_commit.sha === expected.sourceSha &&
                comparison.total_commits > 0 && comparison.total_commits <= 5 &&
                comparison.commits.length === comparison.total_commits,
                'Recovery must descend directly from the tested commit with a short, fully inspectable history.');
              requireGuard(comparison.files?.length === 1 && comparison.files[0].filename === expected.recoveryWorkflow &&
                comparison.files[0].status === 'added', 'Only the recovery workflow may differ from the tested commit.');
              // Inspect every intervening commit, including changes later reverted.
              for (const item of comparison.commits) {
                const {data: commit} = await github.rest.repos.getCommit({...repo, ref: item.sha});
                requireGuard(commit.files?.length === 1 && commit.files[0].filename === expected.recoveryWorkflow &&
                  ['added', 'modified'].includes(commit.files[0].status) && !commit.files[0].previous_filename,
                  'An intervening commit changed files outside this recovery workflow.');
              }
              const {data: run} = await github.rest.actions.getWorkflowRun({...repo, run_id: expected.sourceRunId});
              requireGuard(run.id === expected.sourceRunId && run.repository.id === expected.repositoryId &&
                run.head_repository.id === expected.repositoryId && run.head_sha === expected.sourceSha &&
                run.head_branch === 'main' && run.event === 'push' && run.path === expected.sourceWorkflow &&
                run.workflow_id === expected.sourceWorkflowId && run.run_attempt === expected.sourceAttempt &&
                run.status === 'completed' && run.conclusion === 'failure',
                'Source run identity, attempt, or completed failure state did not match.');
              const {data: job} = await github.rest.actions.getJobForWorkflowRun({...repo, job_id: expected.sourceJobId});
              requireGuard(job.run_id === expected.sourceRunId && job.head_sha === expected.sourceSha &&
                job.run_attempt === expected.sourceAttempt && job.name === 'production' &&
                job.status === 'completed' && job.conclusion === 'failure', 'Source production job did not match.');
              const step = name => {
                const matches = job.steps.filter(s => s.name === name);
                requireGuard(matches.length === 1, `Expected exactly one source step: ${name}`);
                return matches[0];
              };
              for (const name of ['Run complete discovered test suite', 'Verify scoped workspace database reader is deployed',
                'Configure GitHub Pages', 'Build and retain one artifact for both hosts', 'Deploy production Worker',
                'Upload the same artifact to GitHub Pages']) {
                const s = step(name);
                requireGuard(s.status === 'completed' && s.conclusion === 'success', `Source prerequisite did not succeed: ${name}`);
              }
              const failed = job.steps.filter(s => !['success', 'skipped'].includes(s.conclusion));
              requireGuard(failed.length === 1 && failed[0].name === 'Deploy GitHub Pages' &&
                failed[0].status === 'completed' && failed[0].conclusion === 'failure', 'Pages must be the only failed source step.');
              const {data: artifact} = await github.rest.actions.getArtifact({...repo, artifact_id: expected.artifactId});
              requireGuard(artifact.id === expected.artifactId && artifact.name === 'github-pages' && !artifact.expired &&
                artifact.size_in_bytes === expected.artifactBytes && artifact.digest === expected.artifactDigest &&
                artifact.workflow_run?.id === expected.sourceRunId && artifact.workflow_run.repository_id === expected.repositoryId &&
                artifact.workflow_run.head_repository_id === expected.repositoryId && artifact.workflow_run.head_sha === expected.sourceSha &&
                artifact.workflow_run.head_branch === 'main', 'Artifact metadata or digest did not match the tested upload.');
              const upload = step('Upload the same artifact to GitHub Pages');
              requireGuard(Date.parse(artifact.created_at) >= Date.parse(upload.started_at) &&
                Date.parse(artifact.created_at) <= Date.parse(upload.completed_at), 'Artifact was not created by the verified upload step.');
              core.info(`Verified original artifact ${expected.artifactId} from tested commit ${expected.sourceSha}. No application rebuild.`);
              for (const [name, value] of Object.entries({
                artifact_id: expected.artifactId,
                artifact_bytes: expected.artifactBytes,
                archive_sha: expected.artifactDigest.replace('sha256:', ''),
                manifest_sha: expected.manifestSha256,
                release_id: expected.releaseId,
                retained_releases: expected.retainedReleases
              })) core.setOutput(name, String(value));
            } catch (error) {
              core.setFailed(error.safeRecoveryMessage ? error.message :
                `Source verification failed (HTTP ${Number(error.status) || 'network/runtime'}).`);
            }

      - name: Download and verify the exact original Pages archive
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_ID: ${{ steps.verify_source.outputs.artifact_id }}
          ARTIFACT_BYTES: ${{ steps.verify_source.outputs.artifact_bytes }}
          ARCHIVE_SHA: ${{ steps.verify_source.outputs.archive_sha }}
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Jac1827/ATLAS/actions/artifacts/$ARTIFACT_ID/zip" \
            --output original-pages.zip
          python3 - <<'PYCODE'
          import hashlib, os, pathlib, shutil, stat, zipfile
          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open('rb') as source:
                  for chunk in iter(lambda: source.read(1024 * 1024), b''):
                      digest.update(chunk)
              return digest.hexdigest()
          archive = pathlib.Path('original-pages.zip')
          if archive.stat().st_size != int(os.environ['ARTIFACT_BYTES']):
              raise SystemExit('Downloaded artifact size differs from the verified original.')
          digest = sha256_file(archive)
          if digest != os.environ['ARCHIVE_SHA']:
              raise SystemExit('Downloaded artifact digest differs from the verified original.')
          target = pathlib.Path('pages-artifact/artifact.tar')
          target.parent.mkdir()
          with zipfile.ZipFile(archive) as package:
              entries = package.infolist()
              if len(entries) != 1 or entries[0].filename != 'artifact.tar' or entries[0].is_dir():
                  raise SystemExit('Expected exactly the original artifact.tar entry.')
              entry = entries[0]
              if entry.flag_bits & 1 or stat.S_IFMT(entry.external_attr >> 16) not in (0, stat.S_IFREG):
                  raise SystemExit('Expected one unencrypted regular tar file.')
              with package.open(entries[0]) as source, target.open('wb') as destination:
                  shutil.copyfileobj(source, destination)
          tar_digest = sha256_file(target)
          print(f'Original ZIP bytes and digest verified; unchanged tar SHA256: {tar_digest}')
          PYCODE

      - name: Attach the unchanged Pages tar to this recovery run
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: pages-artifact/artifact.tar
          if-no-files-found: error
          compression-level: 6
          retention-days: 1

      - name: Publish through the standard Pages action with this recovery commit
        id: pages
        uses: actions/deploy-pages@v4

      - name: Verify the exact live release and retained history
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          MANIFEST_SHA: ${{ steps.verify_source.outputs.manifest_sha }}
          RELEASE_ID: ${{ steps.verify_source.outputs.release_id }}
          RETAINED_RELEASES: ${{ steps.verify_source.outputs.retained_releases }}
        with:
          script: |
            const {createHash} = require('node:crypto');
            const wait = ms => new Promise(resolve => setTimeout(resolve, ms));
            let verified = false;
            for (let attempt = 0; attempt < 6; attempt++) {
              try {
                const response = await fetch(`https://jac1827.github.io/ATLAS/atlas-asset-manifest.json?recovery=${context.runId}&attempt=${attempt}`, {
                  headers: {'cache-control': 'no-cache'}, signal: AbortSignal.timeout(15000)
                });
                if (response.ok) {
                  const bytes = Buffer.from(await response.arrayBuffer());
                  if (createHash('sha256').update(bytes).digest('hex') === process.env.MANIFEST_SHA) {
                    const manifest = JSON.parse(bytes.toString('utf8'));
                    verified = manifest.releaseId === process.env.RELEASE_ID &&
                      manifest.retainedReleaseIds?.length === Number(process.env.RETAINED_RELEASES);
                    if (verified) break;
                  }
                }
              } catch {
                core.warning(`Live manifest request ${attempt + 1}/6 failed; retrying.`);
              }
              await wait(10000);
            }
            if (!verified) core.setFailed('Pages reported success but the exact tested live manifest was not verified.');
            else core.info(`Verified live release ${process.env.RELEASE_ID} with all ${process.env.RETAINED_RELEASES} retained releases.`);
