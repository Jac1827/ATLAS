<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="0; url=portfolio-operations-dashboard/">
<title>Opening ATLAS RISE Ops Dashboard</title>
<script>
  window.location.replace("portfolio-operations-dashboard/");
</script>
<style>
  :root {
    --ink: #14344a;
    --steel: #6b8798;
    --paper: #ffffff;
    --mist: #eef3f6;
    --line: #d5e0e6;
    --accent: #2e6b8c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(46,107,140,0.18), transparent 30%),
      linear-gradient(180deg, #f8fbfc 0%, var(--mist) 100%);
  }
  main {
    width: min(720px, 100%);
    padding: 32px;
    border: 1px solid var(--line);
    border-radius: 24px;
    background: rgba(255,255,255,0.92);
    box-shadow: 0 20px 48px rgba(20,52,74,0.08);
  }
  h1 {
    margin: 0 0 10px;
    font-size: 1.8rem;
    line-height: 1.1;
  }
  p {
    margin: 0 0 20px;
    color: #476273;
    line-height: 1.6;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
  }
  a {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    padding: 0 18px;
    border-radius: 12px;
    text-decoration: none;
    font-weight: 700;
  }
  .primary {
    background: var(--accent);
    color: #fff;
  }
  .secondary {
    background: var(--paper);
    color: var(--ink);
    border: 1px solid var(--line);
  }
</style>
</head>
<body>
<main>
  <h1>Opening ATLAS RISE Ops Dashboard</h1>
  <p>Opening the ATLAS RISE Ops Dashboard. The REIT Management page remains available below.</p>
  <div class="actions">
    <a class="primary" href="portfolio-operations-dashboard/">Open ATLAS</a>
    <a class="secondary" href="reit-management/">Open REIT Management</a>
  </div>
</main>
</body>
</html>
