<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RISE Budget Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#013e51;--light:#6ba2b8;--pale:#e8f1f4;--band:#e3eef2;--ink:#1b2b33;--muted:#4f6169;--line:#d8e2e6;--bg:#f3f6f7;--warn-bg:#fff1e3;--warn:#9a3d0a;--ok-bg:#e3f4ea;--ok:#17663d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--ink);font-size:14px}
a{color:var(--navy)}
button,input,select,textarea{font:inherit}
.topbar{background:#fff;border-bottom:3px solid var(--navy);display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 20px}
.logo{height:32px;width:auto}
.ttl{font-family:Montserrat,Inter,sans-serif;font-weight:800;font-size:19px;color:var(--navy)}
.sub{color:var(--muted);font-size:12px}
.grow{flex:1 1 auto}
.app{max-width:1480px;margin:0 auto;padding:0 20px 56px}
.sel,.inp{font-size:13px;border:1px solid #b9c8ce;border-radius:6px;padding:7px 9px;background:#fff;color:var(--ink);min-height:36px}
.inp:disabled,.sel:disabled{background:#eef2f3;color:#5d6d74}
.inp.num{text-align:right;font-variant-numeric:tabular-nums;width:120px}
.inp.sm{width:80px}.inp.xs{width:64px}
.inp.note{width:100%;min-width:200px}
.btn{font-size:13px;font-weight:600;border-radius:6px;padding:8px 14px;min-height:36px;cursor:pointer;border:1px solid var(--navy);background:var(--navy);color:#fff}
.btn:hover{background:#0b5d78}.btn.ghost{background:#fff;color:var(--navy)}.btn.ghost:hover{background:var(--pale)}
.btn.warn{background:#fff;color:#a13a0b;border-color:#d98b5f}.btn.tiny{padding:3px 9px;min-height:30px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--pale);color:var(--navy);white-space:nowrap}
.pill.lock{background:var(--navy);color:#fff}.pill.warn{background:var(--warn-bg);color:var(--warn)}.pill.ok{background:var(--ok-bg);color:var(--ok)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi .k{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;font-weight:600}
.kpi .v{font-family:Montserrat,Inter,sans-serif;font-weight:700;font-size:20px;color:var(--navy);margin-top:4px;font-variant-numeric:tabular-nums}
.kpi .d{font-size:12px;color:var(--muted);margin-top:2px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;border-bottom:2px solid var(--line);margin-bottom:16px}
.tab{font-size:13.5px;font-weight:600;background:transparent;border:0;border-bottom:3px solid transparent;margin-bottom:-2px;padding:10px 14px;color:var(--muted);cursor:pointer;min-height:44px}
.tab.on{color:var(--navy);border-bottom-color:var(--light)}
.tab .n{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--pale);color:var(--navy);font-size:11px;line-height:20px;text-align:center;margin-right:6px}
.tab.on .n{background:var(--navy);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
.h2{font-family:Montserrat,Inter,sans-serif;font-weight:700;font-size:16px;color:var(--navy);margin:0 0 4px}
.h3{font-weight:700;font-size:13.5px;color:var(--navy);margin:0 0 6px}
.muted{color:var(--muted);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px}
.choice{display:block;text-align:left;background:#fff;border:1.5px solid #d0dbe0;border-radius:10px;padding:12px 14px;cursor:pointer;min-height:44px;width:100%}
.choice.on{border-color:var(--navy);background:#eef5f8;box-shadow:inset 0 0 0 1px var(--navy)}
.choice b{display:block;color:var(--navy);font-size:13.5px}.choice span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:#fff}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{background:var(--navy);color:#fff;font-weight:600;text-align:left;padding:8px 10px;white-space:nowrap}
th.r,td.r{text-align:right}
td{padding:6px 10px;border-bottom:1px solid #e6ecee;vertical-align:middle;font-variant-numeric:tabular-nums}
tr.sec td{background:var(--light);color:#fff;font-weight:700}
tr.sec button{color:#fff;background:transparent;border:0;font-weight:700;cursor:pointer;padding:0;min-height:30px}
tr.sub td{background:var(--band);font-weight:700;color:var(--navy)}
tr.tot td{background:var(--navy);color:#fff;font-weight:700}
tr.item td{background:#f8fbfc;color:#33464e;font-size:12px}
td.gl{color:var(--muted);width:56px}
.chip{display:inline-block;font-size:11px;font-weight:600;border-radius:4px;padding:2px 6px;margin:1px 3px 1px 0;white-space:nowrap}
.chip.link{background:var(--pale);color:#0b4a5e}.chip.fix{background:#eceff1;color:#46565d}.chip.warn{background:var(--warn-bg);color:var(--warn)}.chip.ok{background:var(--ok-bg);color:var(--ok)}.chip.model{background:#efe9fb;color:#4b2a8c}
.linkbtn{font-size:12px;color:#0b5d78;background:none;border:0;padding:0;cursor:pointer;text-decoration:underline;min-height:24px}
.bars{display:flex;align-items:flex-end;gap:8px;height:150px;padding:8px 4px 0;border-bottom:1px solid #b9c8ce}
.bar{flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar .b{width:100%;max-width:38px;background:var(--light);border-radius:4px 4px 0 0}.bar .b.hi{background:var(--navy)}
.bar .t{font-size:10.5px;margin-bottom:3px}
.barl{display:flex;gap:8px;padding:4px 4px 0}.barl span{flex:1 1 0;text-align:center;font-size:11px;color:var(--muted)}
.step{display:flex;flex-wrap:wrap;margin:8px 0 14px}
.st{flex:1 1 150px;padding:10px 12px;border:1px solid #d0dbe0;background:#fff;font-size:12.5px;color:var(--muted)}
.st b{display:block;color:var(--ink);font-size:13px}.st.done{background:var(--pale);border-color:var(--light)}.st.cur{background:var(--navy);color:#e6f0f3;border-color:var(--navy)}.st.cur b{color:#fff}
.log{font-size:12.5px;border-left:3px solid var(--light);padding:2px 0 2px 10px;margin:6px 0;color:#33464e}
.banner{background:var(--warn-bg);border:1px solid #f0c49f;color:#7a3208;border-radius:8px;padding:10px 14px;font-size:13px;margin-bottom:14px}
.banner.info{background:var(--pale);border-color:#b6d0da;color:#0b4a5e}.banner.lock{background:var(--navy);border-color:var(--navy);color:#fff}.banner.ok{background:var(--ok-bg);border-color:#a9d9bd;color:var(--ok)}
.drop{border:2px dashed #9fb8c2;border-radius:10px;padding:18px;text-align:center;background:#f8fbfc}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:#33464e}
label.f small{font-weight:400;color:var(--muted)}
.chk{width:18px;height:18px;accent-color:var(--navy)}
.monthly{display:grid;grid-template-columns:repeat(6,minmax(90px,1fr));gap:6px;padding:6px 0}
.monthly label{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.cover{background:#fff;border:1px solid var(--line);border-radius:6px;max-width:820px;margin:0 auto;padding:40px 48px}
.status{position:fixed;right:16px;bottom:16px;background:var(--navy);color:#fff;padding:10px 14px;border-radius:8px;font-size:13px;max-width:420px;box-shadow:0 4px 16px rgba(0,0,0,.18);z-index:5}
.status.err{background:#8a1c0b}
@media (max-width:700px){.app{padding:0 12px 48px}.topbar{padding:10px 12px}}
@media print{.topbar,.tabs,.kpis,.noprint,.status{display:none!important}.cover{border:0}}
</style>
</head>
<body>
<header class="topbar">
<img class="logo" src="./rise_logo.png" alt="RISE — A Real Estate Company">
<div><div class="ttl">Budget Builder</div><div class="sub">ATLAS · budgets and reforecasts</div></div>
<div class="grow"></div>
<div id="bb-context" class="row"></div>
</header>
<main class="app" id="bb-app"><p class="muted" style="padding:24px 0">Loading Budget Builder…</p></main>
<div id="bb-status" class="status" hidden role="status" aria-live="polite"></div>
<script src="./assets/xlsx.full.min.js?v=c9506197caf809a0"></script>
<script src="./vendor/jszip.min.js"></script>
<script type="module" src="./features/budget-v2/ui.mjs?v=1"></script>
</body>
</html>
