<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Prepare ATLAS workspace</title>
  <style>
    :root{font-family:system-ui,-apple-system,sans-serif;color:#173742;background:#f1f5f6;color-scheme:light}*{box-sizing:border-box}body{margin:0;padding:48px 20px}main{max-width:660px;margin:auto;background:white;border:1px solid #dce5e8;border-radius:16px;padding:32px}h1{font-size:28px;margin:0 0 12px}p{line-height:1.55}label{display:block;font-weight:650;margin:20px 0 7px}input{width:100%;padding:11px;border:1px solid #8ea3aa;border-radius:6px;font:inherit}button{padding:12px 16px;font:inherit;font-weight:650;border-radius:6px;border:1px solid #174f60;background:#174f60;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:default}button.secondary{background:white;color:#174f60}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}#activation-status{margin-top:24px;padding:14px;background:#edf4f6;border-radius:8px}#activation-source{overflow-wrap:anywhere;font-size:14px}details{margin-top:16px}#activation-detail{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#174f60}:focus-visible{outline:3px solid #1e83b0;outline-offset:3px}@media(max-width:480px){body{padding:20px 12px}main{padding:24px 20px}}
  </style>
  <script defer src="./centralization/atlas-central-client.js?v=3b6ae81392c2ebd9"></script>
  <script defer src="./performance/feature-loader.js?v=c3682eb824b842e6"></script>
  <script type="module" src="./features/workspace-activation.mjs?v=527e5ddcac3da995"></script>
</head>
<body>
<main id="workspace-activation">
  <h1>Prepare ATLAS workspace</h1>
  <p>Use the version and fingerprint from the completed source verification. An active ATLAS administrator must check the saved source before preparing the workspace.</p>
  <form id="activation-form">
    <label for="activation-version">Verified source version</label>
    <input id="activation-version" name="version" inputmode="numeric" pattern="[1-9][0-9]*" autocomplete="off" required>
    <label for="activation-hash">Verified source fingerprint</label>
    <input id="activation-hash" name="archiveHash" pattern="[a-fA-F0-9]{64}" minlength="64" maxlength="64" autocomplete="off" spellcheck="false" required>
    <div class="actions"><button id="activation-inspect" type="submit">Check saved source</button><button id="activation-prepare" type="button" disabled>Prepare verified workspace</button><button id="activation-download" type="button" class="secondary" disabled>Download verification copy</button><button id="activation-cancel" type="button" class="secondary" disabled>Stop</button></div>
  </form>
  <p id="activation-status" role="status" aria-live="polite">Enter the verified source details, then check the saved source.</p>
  <p id="activation-source" hidden></p>
  <details id="activation-details" hidden><summary>Details</summary><p id="activation-detail"></p></details>
  <p><a href="./index.html">Open ATLAS to sign in</a></p>
</main>
</body>
</html>
