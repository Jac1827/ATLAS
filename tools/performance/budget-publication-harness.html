window.atlasAccessDecision=()=>({ok:true});let published;
window.ATLAS_CENTRAL={readCommunitiesForAccess:async()=>[{community_id:'10000000-0000-0000-0000-000000000001',display_name:'Synthetic community'}],fetchJson:async path=>path.includes('publications?')?[{publication_id:'test'}]:[],rpc:async(name,args)=>{published=args.p_payload;return {publication_id:'test',version:1};}};
const matrix=value=>Array(12).fill(value);
const frame=document.querySelector('iframe');window.fixtureMarkup=`<!doctype html><meta charset="utf-8"><body><script>window.RBB={app:{state:${JSON.stringify({properties:[{id:'test',name:'Synthetic',fiscalYearBegins:'Jan',occupancyByYear:{2026:matrix(.95)}}],activeProperty:'test',budgetYear:2026,activeScenario:'approved',scenarios:[{id:'approved',type:'approved',locked:true,name:'Approved'}],approvedBudgetImports:{'test|2026':{effectiveDate:'2026-01-01',sourceFile:'budget.xlsx',sourceSheet:'Approved',rows:[{gl:'5120',monthly:matrix(1000)},{gl:'6500',monthly:matrix(200)},{gl:'7200',monthly:matrix(500)}]}},periods:{'test|2026':{source:'actuals.xlsx',loadedAt:'2026-09-20T10:00:00Z',closedThrough:9}},actuals:{'test|5120|2026':{monthly:matrix(900)},'test|6500|2026':{monthly:matrix(250)}}})}},gl:g=>({name:g==='7200'?'Capital Expenditures':g==='5120'?'GPR':'Repairs',nature:g==='5120'?'income':'expense',group:'Test'}),actuals:{get:(s,p,g,y)=>s.actuals[p+'|'+g+'|'+y]?.monthly}};<\/script><script type="module" src="../../docs/portfolio-operations-dashboard/features/budget-command-publication.mjs"><\/script></body>`;

 const assert=(v,m)=>{if(!v)throw Error(m);},wait=async f=>{for(let i=0;i<100;i++){if(f())return;await new Promise(r=>setTimeout(r,20));}throw Error('Timed out');};
