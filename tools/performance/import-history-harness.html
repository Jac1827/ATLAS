import {historyOperation} from '../../docs/portfolio-operations-dashboard/features/import-history.mjs';
const dbName='atlas-import-history-test-'+crypto.randomUUID(),storeName='records',key='imports';
const run=(operation,extra={})=>historyOperation({operation,dbName,storeName,key,...extra});
try {
 const before={capturedAt:'2026-09-21',savedData:{A:{occupied:0}},lineage:[{source:'approved'}]};
 await run('save',{value:{closedPeriods:['2026-08'],batches:[{id:'a',status:'Approved',beforeSnapshot:before}]}});

 document.querySelector('#result').textContent=JSON.stringify({passed:true,checks:['worker projection','exact backup readback','summary persistence','changed-evidence rejection','atomic rollback'],database:'isolated temporary database'});
} catch(e){document.querySelector('#result').textContent=JSON.stringify({passed:false,error:e.message});}
